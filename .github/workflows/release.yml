name: release

# Builds a tagged release through the same package.yml as CI. The package
# declares whatever the manifest in the tag declares: Windows only today, both
# platforms once macOS is declared in the tree. A release is never left to
# guess - a macOS declaration with an unsigned or un-notarized helper fails it.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach the plugin to
        required: true

permissions:
  contents: write

jobs:
  package:
    uses: ./.github/workflows/package.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
      notarize: true
      require-signing: true
      require-notarized: true
    secrets: inherit

  release:
    needs: package
    runs-on: ubuntu-latest

    steps:
      - name: Check the tag matches the manifest version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          # A tag that disagrees with the manifest would ship a build the
          # release notes do not describe.
          echo "tag=${TAG#v} manifest=$VERSION"
          case "$VERSION" in "${TAG#v}"*) ;; *) echo "::error::tag ${TAG#v} does not match manifest version $VERSION"; exit 1 ;; esac

      - uses: actions/download-artifact@v7
        with:
          name: com.bad-duck.teamscontrol.streamDeckPlugin
          path: dist

      - name: Attach the plugin to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*.streamDeckPlugin
          fail_on_unmatched_files: true