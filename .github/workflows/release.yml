name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach the plugin to
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - run: npm ci

      - name: Unit tests
        run: npm run test

      - name: Build and package
        run: |
          npm run build
          # The guard against shipping a package that declares a platform it
          # cannot serve. Inert while the manifest is Windows-only on a Windows
          # runner, and that is the point: the day `mac` is added to the
          # manifest, a release built here would find no Mach-O and pack a
          # plugin that installs on macOS and does nothing. Nothing about the
          # file would say so. Fail the release instead.
          node tools/check-sidecars.ts
          npx streamdeck validate com.bad-duck.teamscontrol.sdPlugin --no-update-check
          npx streamdeck pack com.bad-duck.teamscontrol.sdPlugin --output dist --force --no-update-check

      - name: Check the tag matches the manifest version
        shell: pwsh
        run: |
          # A tag that disagrees with the manifest would ship a build the
          # release notes do not describe.
          $tag = "${{ inputs.tag || github.ref_name }}" -replace '^v', ''
          $manifest = (Get-Content com.bad-duck.teamscontrol.sdPlugin/manifest.json -Raw | ConvertFrom-Json).Version
          Write-Host "tag=$tag manifest=$manifest"
          if (-not $manifest.StartsWith($tag)) {
            throw "tag $tag does not match manifest version $manifest"
          }

      - name: Attach the plugin to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*.streamDeckPlugin
          fail_on_unmatched_files: true
