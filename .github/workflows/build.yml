name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sidecar-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build Swift sidecar
        run: npm run build:sidecar:macos

      - uses: actions/upload-artifact@v7
        with:
          name: sidecar-macos
          path: com.bad-duck.teamscontrol.sdPlugin/bin/sidecar/TeamsBridge
          if-no-files-found: error

  build:
    # The .NET sidecar is a win-x64 UI Automation host. Packaging waits for
    # the Swift binary below so one .streamDeckPlugin can hold both.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (TypeScript)
        run: npm run test:ts

      - name: Unit tests (C#)
        run: npm run test:cs

      - name: Build sidecar
        run: npm run build:sidecar

      - name: Build plugin
        run: npm run build:plugin

      - name: Validate manifest
        run: npx streamdeck validate com.bad-duck.teamscontrol.sdPlugin --no-update-check

      - name: Upload unpacked plugin
        uses: actions/upload-artifact@v7
        with:
          name: plugin-unpacked
          path: com.bad-duck.teamscontrol.sdPlugin
          if-no-files-found: error

  pack:
    needs: [build, sidecar-macos]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: actions/download-artifact@v7
        with:
          name: plugin-unpacked
          path: com.bad-duck.teamscontrol.sdPlugin

      - uses: actions/download-artifact@v7
        with:
          name: sidecar-macos
          path: com.bad-duck.teamscontrol.sdPlugin/bin/sidecar

      - name: Mark macOS sidecar executable
        run: chmod +x com.bad-duck.teamscontrol.sdPlugin/bin/sidecar/TeamsBridge

      - name: Package
        run: npx streamdeck pack com.bad-duck.teamscontrol.sdPlugin --output dist --force --no-update-check

      - name: Upload plugin
        uses: actions/upload-artifact@v7
        with:
          name: com.bad-duck.teamscontrol.streamDeckPlugin
          path: dist/*.streamDeckPlugin
          if-no-files-found: error
