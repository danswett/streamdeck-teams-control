name: build

# Every PR and every push to main builds the package exactly as a release would,
# declaring macOS alongside Windows, so the combined package - both helpers,
# packed on Windows, opened and run on a Mac - is exercised on every change
# rather than first attempted on the day macOS ships. The manifest in the tree
# is not touched; the declaration is added for this build only.
#
# Signing happens whenever the certificate is available. Notarization waits on
# Apple's queue, so it is opt-in here; macos-testbuild and release always do it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      notarize:
        description: Also notarize the macOS helper (adds an unbounded wait on Apple)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    uses: ./.github/workflows/package.yml
    with:
      notarize: ${{ inputs.notarize == true }}
      declare-mac: true
    secrets: inherit