name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      notarize:
        description: Also notarize the macOS sidecar (adds an unbounded wait on Apple)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Builds the macOS sidecar without shipping it. The manifest does not declare
  # macOS yet, but the Swift is in the tree and a job nobody runs is a job that
  # quietly stops compiling. Deliberately not a dependency of the packaging job
  # below: a Swift breakage should be visible without blocking a Windows
  # release.
  #
  # When the signing secrets exist this also proves out the publishing path -
  # universal binary, Developer ID signature, notarization - so none of it is
  # first attempted on the day macOS is declared.
  sidecar-macos:
    runs-on: macos-latest
    # Signing is ours and takes seconds. Notarization is a queue at Apple and
    # took 44 minutes on this team's first submission, so it is opt-in rather
    # than on every push - see the notarize input. The ceiling covers a slow
    # notarizing run; a normal one is about two minutes.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Write the notary key, if configured
        id: notary
        env:
          NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
        run: |
          if [ -n "$NOTARY_KEY" ]; then
            printf '%s' "$NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
            echo "path=$RUNNER_TEMP/notary.p8" >> "$GITHUB_OUTPUT"
          fi

      - name: Import the signing certificate, if configured
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_P12" ]; then
            echo "No MACOS_CERT_P12 - building unsigned."
            exit 0
          fi
          # A throwaway keychain, unlocked only for this job. Importing into the
          # login keychain would leave the identity on a shared runner image.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          PASSPHRASE="$(uuidgen)"
          security create-keychain -p "$PASSPHRASE" "$KEYCHAIN"
          security set-keychain-settings -lut 900 "$KEYCHAIN"
          security unlock-keychain -p "$PASSPHRASE" "$KEYCHAIN"
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign
          # codesign: matters as much as the other two. Without it in the
          # partition list codesign asks the keychain for authorisation through
          # a UI prompt, and on a headless runner nobody answers - the job hangs
          # until it is killed rather than failing. Cost us a 41-minute run.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$PASSPHRASE" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build Swift sidecar
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          # Off unless asked for. Signing runs every time; notarization waits on
          # Apple and belongs where a shippable artifact is being produced.
          MACOS_NOTARIZE: ${{ inputs.notarize && '1' || '' }}
          # API key, if App Store Connect API access has been granted.
          MACOS_NOTARY_KEY_PATH: ${{ steps.notary.outputs.path }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          # App-specific password, which needs no extra access and works now.
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: npm run build:sidecar:macos

      - name: Report what the binary actually is
        # Printed every run, signed or not, because all three facts that made
        # the 1.10.1 binary unfit to ship were readable straight off the
        # artifact and nobody was looking.
        run: |
          APP=com.bad-duck.teamscontrol.sdPlugin/bin/sidecar/TeamsBridge.app
          lipo -info "$APP/Contents/MacOS/TeamsBridge"
          codesign --display --verbose=4 "$APP" 2>&1 | grep -E 'Authority|Signature|flags' || true
          echo "--- stapled ticket (absent until a notarizing run) ---"
          xcrun stapler validate "$APP" 2>&1 || true
          echo "--- Gatekeeper assessment ---"
          spctl --assess --type execute --verbose=4 "$APP" 2>&1 || true

      - uses: actions/upload-artifact@v7
        with:
          name: sidecar-macos
          path: com.bad-duck.teamscontrol.sdPlugin/bin/sidecar/TeamsBridge.app
          if-no-files-found: error

  build:
    # The sidecar is a win-x64 UI Automation host and the Stream Deck CLI packs
    # on Windows, so there is nothing to gain from a matrix here.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (TypeScript)
        run: npm run test:ts

      - name: Unit tests (C#)
        run: npm run test:cs

      - name: Build sidecar
        run: npm run build:sidecar

      - name: Build plugin
        run: npm run build:plugin

      - name: Validate manifest
        run: npx streamdeck validate com.bad-duck.teamscontrol.sdPlugin --no-update-check

      - name: Package
        run: npx streamdeck pack com.bad-duck.teamscontrol.sdPlugin --output dist --force --no-update-check

      - name: Upload plugin
        uses: actions/upload-artifact@v7
        with:
          name: com.bad-duck.teamscontrol.streamDeckPlugin
          path: dist/*.streamDeckPlugin
          if-no-files-found: error
