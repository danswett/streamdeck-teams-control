name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Builds the macOS sidecar without shipping it. The manifest does not declare
  # macOS - the binary is arm64-only and ad-hoc signed, so Intel Macs cannot run
  # it and Gatekeeper would likely refuse a Marketplace download - but the Swift
  # is in the tree and a job nobody runs is a job that quietly stops compiling.
  # Deliberately not a dependency of the packaging job below: a Swift breakage
  # should be visible without blocking a Windows release.
  sidecar-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build Swift sidecar
        run: swift build -c release --package-path sidecar-macos

  build:
    # The sidecar is a win-x64 UI Automation host and the Stream Deck CLI packs
    # on Windows, so there is nothing to gain from a matrix here.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (TypeScript)
        run: npm run test:ts

      - name: Unit tests (C#)
        run: npm run test:cs

      - name: Build sidecar
        run: npm run build:sidecar

      - name: Build plugin
        run: npm run build:plugin

      - name: Validate manifest
        run: npx streamdeck validate com.bad-duck.teamscontrol.sdPlugin --no-update-check

      - name: Package
        run: npx streamdeck pack com.bad-duck.teamscontrol.sdPlugin --output dist --force --no-update-check

      - name: Upload plugin
        uses: actions/upload-artifact@v7
        with:
          name: com.bad-duck.teamscontrol.streamDeckPlugin
          path: dist/*.streamDeckPlugin
          if-no-files-found: error
