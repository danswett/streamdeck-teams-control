name: macos-testbuild

# The rolling preview a Mac tester installs: download a .streamDeckPlugin,
# double-click, done.
#
# main's manifest declares Windows only, so a build from main would not install
# on a Mac at all. This builds the same package a release will be once macOS is
# declared - both helpers, Windows and macOS, in one file - so the preview tests
# the real thing, and a Windows user who picks it up by mistake gets a working
# plugin rather than one with no helper.
#
# Published as a prerelease, clearly marked, never as a Marketplace submission.
# One rolling tag rather than a release per push keeps a single permanent URL to
# hand a tester, and keeps the release list from filling with builds nobody
# will install.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      notarize:
        description: Notarize (untick only to skip Apple's queue)
        type: boolean
        default: true

permissions:
  contents: write

# One at a time, newest wins - two runs would fight over the rolling tag and its
# asset. Cancelling mid-notarization is safe: the submission lives on Apple's
# side and the next run staples it from cache.
concurrency:
  group: macos-testbuild
  cancel-in-progress: true

jobs:
  package:
    uses: ./.github/workflows/package.yml
    with:
      notarize: ${{ github.event_name == 'push' || inputs.notarize }}
      require-signing: true
      declare-mac: true
      # Stream Deck refuses to install a version it already has - it stops at
      # checkAlreadyInstalled and shows no dialog at all - so every preview gets
      # a distinct fourth component and installs over the last.
      version-suffix: ${{ github.run_number }}
      artifact: preview
    secrets: inherit

  publish:
    needs: package
    # Only main moves the tester's link. A dispatch from a branch builds and
    # verifies the preview without publishing it.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: preview
          path: dist

      - name: Publish the rolling test build
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.package.outputs.version }}
          NOTARIZED: ${{ needs.package.outputs.notarized }}
        run: |
          TAG=macos-test

          if [ "$NOTARIZED" = "true" ]; then
            STATE="Developer ID signed and **notarized by Apple**, ticket stapled"
          else
            STATE="Developer ID signed but **not notarized** - Apple's queue outran the wait on this run, so expect Gatekeeper to ask"
          fi

          cat > notes.md <<NOTES
          **Preview build with macOS support — not a Marketplace submission.**

          Rebuilt automatically on every push to \`main\`. This release rolls: the tag,
          the notes and the attached package always describe the newest build, so this
          URL never goes stale and never needs replacing.

          Built from \`main\` at \`${GITHUB_SHA:0:7}\` as version \`$VERSION\`.

          One package for both platforms: the Windows helper and a universal
          (\`arm64\` + \`x86_64\`) macOS helper. The macOS helper is $STATE.
          The released Marketplace build still declares Windows only.

          ### Install
          Download the \`.streamDeckPlugin\` below and double-click it. Please do not
          sideload or \`streamdeck link\` — a downloaded install is what users will get.

          On a Mac the plugin asks once whether to turn on Teams control, which needs
          Accessibility permission. Findings go on #52.
          NOTES

          # Move the tag rather than deleting and recreating it. Deleting a tag
          # that backs a release turns the release into an untagged draft and
          # takes its download URL with it - which is exactly what happened on
          # 2026-09-23 while repointing macos-test-1.10.2.2.
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"

          TITLE="Preview with macOS (latest) — $VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file notes.md --prerelease
            gh release upload "$TAG" dist/*.streamDeckPlugin --clobber
          else
            gh release create "$TAG" dist/*.streamDeckPlugin \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes-file notes.md \
              --prerelease
          fi

          echo "Published $TITLE to the rolling '$TAG' release."