<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>High fidelity music mode settings</title>
		<link rel="stylesheet" href="inspector.css" />
		<script src="sdpi-components.js"></script>
	</head>
	<body>
		<p class="hint" id="action-description"></p>
		<script src="action-descriptions.js"></script>
		<script>
			SDPIComponents.streamDeckClient.getConnectionInfo().then(({ actionInfo }) => {
				const text = globalThis.ACTION_DESCRIPTIONS?.[actionInfo?.action];
				if (text) document.getElementById("action-description").textContent = text;
			});
		</script>
	</body>
</html>
