<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Stop presenting settings</title>
		<link rel="stylesheet" href="inspector.css" />
		<script src="sdpi-components.js"></script>
	</head>
	<body>
		<p class="hint" id="action-description"></p>

		<sdpi-item label="Confirm">
			<sdpi-checkbox setting="requireHold" label="Press and hold to stop"></sdpi-checkbox>
		</sdpi-item>
		<p class="hint">
			Stopping ends the presentation for everyone in the meeting. With this
			enabled the key must be held for about a second before it takes effect.
		</p>

		<sdpi-item label="Profile">
			<sdpi-checkbox
				global
				setting="pptAutoProfile"
				label="Switch profile during PowerPoint Live"
			></sdpi-checkbox>
		</sdpi-item>
		<p class="hint">
			Shared with every PowerPoint Live key. Switches to the bundled "PowerPoint
			Live" profile while a deck is being presented, and back afterwards.
		</p>
		<script src="action-descriptions.js"></script>
		<script>
			// Several actions share each inspector - twenty share ppt.html - so it has
			// to name the key you actually clicked. textContent, never innerHTML.
			SDPIComponents.streamDeckClient.getConnectionInfo().then(({ actionInfo }) => {
				const text = globalThis.ACTION_DESCRIPTIONS?.[actionInfo?.action];
				if (text) document.getElementById("action-description").textContent = text;
			});
		</script>
	</body>
</html>
