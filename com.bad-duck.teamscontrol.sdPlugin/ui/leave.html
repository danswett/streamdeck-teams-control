<!doctype html>
<html>
	<head lang="en">
		<meta charset="utf-8" />
		<script src="sdpi-components.js"></script>
	</head>
	<body>
		<sdpi-item label="Confirm">
			<sdpi-checkbox setting="requireHold" label="Press and hold to leave"></sdpi-checkbox>
		</sdpi-item>
		<p style="color: #999; font-size: 11px; padding: 0 8px">
			Leaving a meeting can't be undone. With this enabled the key must be held
			for about a second before it takes effect.
		</p>

		<details>
			<summary style="cursor: pointer; margin: 8px 0; color: #999">Diagnostics</summary>
			<sdpi-item label="Map Teams UI">
				<button id="discover-toolbar">Dump toolbar</button>
			</sdpi-item>
			<p style="color: #999; font-size: 11px; padding: 0 8px">
				Join a meeting first. Results are written to the plugin log.
			</p>
		</details>

		<script>
			const { streamDeckClient } = SDPIComponents;
			document.getElementById("discover-toolbar").addEventListener("click", () => {
				streamDeckClient.send("sendToPlugin", { command: "discover", menu: "" });
			});
		</script>
	</body>
</html>
