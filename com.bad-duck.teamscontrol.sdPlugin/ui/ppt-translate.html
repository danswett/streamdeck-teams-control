<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Translate slides settings</title>
		<link rel="stylesheet" href="inspector.css" />
		<script src="sdpi-components.js"></script>
	</head>
	<body>
		<p class="hint" id="action-description"></p>

		<sdpi-item label="Language">
			<sdpi-select setting="language" default="Original">
				<option value="Original">Original (turn translation off)</option>
				<option value="العربية">العربية — Arabic</option>
				<option value="简体中文">简体中文 — Chinese, Simplified</option>
				<option value="繁體中文">繁體中文 — Chinese, Traditional</option>
				<option value="Nederlands">Nederlands — Dutch</option>
				<option value="English">English</option>
				<option value="Français">Français — French</option>
				<option value="Deutsch">Deutsch — German</option>
				<option value="Ελληνική">Ελληνική — Greek</option>
				<option value="עברית">עברית — Hebrew</option>
				<option value="हिन्दी">हिन्दी — Hindi</option>
				<option value="Gaeilge">Gaeilge — Irish</option>
				<option value="Italiano">Italiano — Italian</option>
				<option value="日本語">日本語 — Japanese</option>
				<option value="한국어">한국어 — Korean</option>
				<option value="Português">Português — Portuguese</option>
				<option value="Русский">Русский — Russian</option>
				<option value="Español">Español — Spanish</option>
				<option value="ไทย">ไทย — Thai</option>
				<option value="Türkçe">Türkçe — Turkish</option>
			</sdpi-select>
		</sdpi-item>
		<p class="hint">
			Translation is applied to your view only — the presenter and everyone else
			keep seeing the original slides. Set a second key to "Original" to switch
			back.
		</p>

		<sdpi-item label="Profile">
			<sdpi-checkbox
				global
				setting="pptAutoProfile"
				label="Switch profile during PowerPoint Live"
			></sdpi-checkbox>
		</sdpi-item>
		<p class="hint">
			Shared with every PowerPoint Live key. Switches to the bundled "PowerPoint
			Live" profile while a deck is being presented, and back afterwards.
		</p>
		<script src="action-descriptions.js"></script>
		<script>
			// Several actions share each inspector - twenty share ppt.html - so it has
			// to name the key you actually clicked. textContent, never innerHTML.
			SDPIComponents.streamDeckClient.getConnectionInfo().then(({ actionInfo }) => {
				const text = globalThis.ACTION_DESCRIPTIONS?.[actionInfo?.action];
				if (text) document.getElementById("action-description").textContent = text;
			});
		</script>
	</body>
</html>
